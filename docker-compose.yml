version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gym_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./storage/qdrant:/qdrant/storage
    restart: always

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: gym_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./storage/ollama:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   restart: always

  postgres:
    image: postgres:15-alpine
    container_name: gym_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-gym_food_db}
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: gym_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gymfood.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      - postgres
    restart: always

  redis:
    image: redis/redis-stack:latest
    container_name: gym_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./storage/redis:/data
    restart: always

